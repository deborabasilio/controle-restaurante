<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Jacaré Vermelho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav>
  <img src="assets/jacare-vermelho.png" alt="Jacaré Vermelho">
  <div class="wordmark">JACARÉ <span>VERMELHO</span></div>
  <button class="hamburguer" id="abrir-menu" aria-label="Abrir menu" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    <span class="badge-menu" id="badge-menu" hidden></span>
  </button>
</nav>

<div class="overlay" id="overlay"></div>

<aside class="menu" id="menu" aria-hidden="true">
  <div class="menu-topo">
    <span class="menu-titulo">Menu</span>
    <button class="fechar-menu" id="fechar-menu" aria-label="Fechar menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
        <line x1="5" y1="5" x2="19" y2="19"></line>
        <line x1="19" y1="5" x2="5" y2="19"></line>
      </svg>
    </button>
  </div>

  <button class="menu-item ativa" data-view="alertas">
    Alertas de estoque
    <span class="badge-item" id="badge-alertas" hidden></span>
  </button>
  <button class="menu-item" data-view="pedido">Pedido da semana</button>
  <button class="menu-item" data-view="produtos">Produtos</button>
  <button class="menu-item" data-view="meus-dados">Meus dados</button>
  <button class="menu-item" data-view="convidar" id="menu-convidar">Convidar usuário</button>

  <button class="menu-item menu-sair" id="sair">Sair</button>
</aside>

<main>
  <section class="view ativa" id="view-alertas">
    <h2>Alertas de estoque</h2>
    <div id="alertas">
      <p class="carregando">Carregando…</p>
    </div>
  </section>

  <section class="view" id="view-pedido">
    <h2>Pedido da semana</h2>

    <div class="campo-mini cheio" id="seletor-pedido-wrap" hidden>
      <label for="seletor-pedido">Contagem</label>
      <select id="seletor-pedido"></select>
    </div>

    <p class="resumo-pedido" id="resumo-pedido"></p>
    <button class="botao-copiar" id="copiar-pedido" hidden>Copiar lista pra enviar</button>

    <div class="lista-produtos" id="lista-pedido">
      <p class="carregando">Carregando…</p>
    </div>

    <details class="sem-necessidade" id="sem-necessidade" hidden>
      <summary id="sem-necessidade-titulo"></summary>
      <ul id="lista-sem-necessidade"></ul>
    </details>
  </section>

  <section class="view" id="view-produtos">
    <h2>Produtos</h2>

    <button class="botao-adicionar" id="abrir-novo-produto">+ Adicionar produto</button>

    <div class="produto-card form-novo" id="form-novo-produto" hidden>
      <div class="titulo-form">Novo produto</div>

      <div class="campos-produto">
        <div class="campo-mini cheio">
          <label for="novo-nome">Nome</label>
          <input type="text" id="novo-nome" placeholder="Ex: Heineken 330 ml" autocomplete="off">
        </div>
      </div>

      <div class="campos-produto">
        <div class="campo-mini">
          <label for="novo-categoria">Categoria</label>
          <select id="novo-categoria">
            <option value="bebida">Bebidas</option>
            <option value="cerveja">Cervejas</option>
            <option value="vinho">Vinhos</option>
          </select>
        </div>
        <div class="campo-mini">
          <label for="novo-unidade">Unidade</label>
          <select id="novo-unidade">
            <option value="un">un</option>
            <option value="garrafa">garrafa</option>
            <option value="caixa">caixa</option>
            <option value="pacote">pacote</option>
          </select>
        </div>
      </div>

      <div class="campos-produto">
        <div class="campo-mini">
          <label for="novo-codigo">Código interno</label>
          <input type="text" id="novo-codigo" placeholder="FT_B000" autocomplete="off">
        </div>
        <div class="campo-mini">
          <label for="novo-estoque">Estoque inicial</label>
          <input type="number" id="novo-estoque" min="0" step="1" placeholder="0" inputmode="numeric">
        </div>
      </div>

      <div class="campos-produto">
        <div class="campo-mini">
          <label for="novo-media">Média semanal</label>
          <input type="number" id="novo-media" min="0" step="1" placeholder="—" inputmode="numeric">
        </div>
        <div class="campo-mini">
          <label for="novo-alerta">Alerta em (unidades)</label>
          <input type="number" id="novo-alerta" min="0" step="1" placeholder="—" inputmode="numeric">
        </div>
        <div class="campo-mini">
          <label for="novo-pacote">Unid. por pacote</label>
          <input type="number" id="novo-pacote" min="1" step="1" placeholder="ex: 12" inputmode="numeric">
        </div>
      </div>
      <p class="dica-form">Deixe "Unid. por pacote" em branco pra vinho — a média semanal dele já é em garrafas.</p>

      <div class="acoes-form">
        <button class="secundario" id="cancelar-novo-produto" type="button">Cancelar</button>
        <button class="primario" id="salvar-novo-produto" type="button">Salvar produto</button>
      </div>
      <p class="mensagem-form" id="novo-mensagem"></p>
    </div>

    <div class="tabs-categoria" id="tabs-categoria"></div>
    <div class="lista-produtos" id="lista-produtos">
      <p class="carregando">Carregando…</p>
    </div>
  </section>

  <section class="view" id="view-meus-dados">
    <h2>Meus dados</h2>
    <div class="produto-card">
      <div class="campos-produto">
        <div class="campo-mini">
          <label>Nome</label>
          <input type="text" id="meu-nome" disabled>
        </div>
        <div class="campo-mini">
          <label>WhatsApp</label>
          <input type="tel" id="meu-telefone" placeholder="5544999999999">
        </div>
      </div>
      <button class="salvar-produto" id="salvar-meus-dados">Salvar</button>
    </div>
  </section>

  <section class="view" id="view-convidar">
    <h2>Convidar usuário</h2>
    <div class="produto-card">
      <div class="campos-produto">
        <div class="campo-mini">
          <label>Nome</label>
          <input type="text" id="convite-nome">
        </div>
        <div class="campo-mini">
          <label>Papel</label>
          <select id="convite-papel">
            <option value="funcionario">Funcionário</option>
            <option value="gestor">Gestor</option>
          </select>
        </div>
      </div>
      <div class="campos-produto" style="margin-top: 10px;">
        <div class="campo-mini">
          <label>E-mail</label>
          <input type="email" id="convite-email">
        </div>
        <div class="campo-mini">
          <label>WhatsApp</label>
          <input type="tel" id="convite-telefone" placeholder="5544999999999">
        </div>
      </div>
      <button class="salvar-produto" id="enviar-convite">Enviar convite</button>
      <p id="convite-mensagem" class="sem-alerta" style="margin-top: 10px;"></p>
    </div>
  </section>
</main>

<script src="js/dashboard.js"></script>
</body>
</html>
